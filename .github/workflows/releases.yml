name: Refresh latest releases

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]
    paths: [".github/scripts/update_releases.py", ".github/workflows/releases.yml"]

permissions:
  contents: write

concurrency:
  group: releases-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild releases table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python .github/scripts/update_releases.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -am "Refresh latest releases [skip ci]"
            git push
          fi
